<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#171717" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>BLINDSPOT — TWO TONE STUDIO</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23171717'/%3E%3Crect x='16' width='16' height='32' fill='%23F0EFEA'/%3E%3C/svg%3E" />
  </head>
  <body class="in-menu">
    <canvas id="game"></canvas>
    <div id="hud" aria-live="polite"></div>
    <div id="toast" role="status"></div>
    <div id="keys" aria-label="Contrôles">
      <div class="grp"><span class="pad"><kbd class="up">Z</kbd><kbd>Q</kbd><kbd>S</kbd><kbd>D</kbd></span><em>Se déplacer</em></div>
      <div class="grp"><kbd class="wide">ESPACE</kbd><em>Jour / Nuit</em></div>
      <div class="grp"><kbd>R</kbd><em>Recommencer</em></div>
      <div class="grp"><kbd>ÉCHAP</kbd><em>Pause</em></div>
    </div>
    <div id="touch">
      <div id="joy-zone"><div id="joy-base"><div id="joy-knob"></div></div></div>
      <button id="btn-vision" aria-label="Changer de vision"></button>
    </div>
    <div id="screens"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
